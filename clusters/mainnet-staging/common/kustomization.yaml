apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: mirror
resources:
- ../../base/common
- ../../base/testkube
- helmrelease.yaml
- sealed-secret.yaml
- sealed-secret-grafana-cloud.yaml
patches:
- target:
    kind: HelmRelease
    name: testkube
  patch: |-
    apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    metadata:
      name: testkube
    spec:
      values:
        mongodb:
          persistence:
            storageClass: hyperdisk-balanced
        testkube-api:
          minio:
            storageClassName: hyperdisk-balanced

