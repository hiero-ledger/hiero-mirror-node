{{ if and .Values.traefik.enabled .Values.traefik.dashboard.enabled -}}
{{- $name := printf "%s-traefik-dashboard" (include "hedera-mirror-common.fullname" .) -}}
{{- $namespace := include "hedera-mirror-common.namespace" . -}}
{{- $secret := lookup "v1" "Secret" $namespace $name | default dict -}}
{{- $data := $secret.data | default dict -}}
apiVersion: v1
kind: Secret
metadata:
  labels: {{ include "hedera-mirror-common.labels" . | nindent 4 }}
  name: {{ $name }}
  namespace: {{ $namespace }}
type: kubernetes.io/basic-auth
data:
  password: {{ coalesce .Values.traefik.dashboard.password (get $data "password" | default "" | b64dec) (randAlphaNum 40) | b64enc }}
  username: {{ .Values.traefik.dashboard.username | b64enc }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  labels: {{ include "hedera-mirror-common.labels" . | nindent 4 }}
  name: {{ $name }}
  namespace: {{ $namespace }}
spec:
  basicAuth:
    secret: {{ $name }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  labels: {{ include "hedera-mirror-common.labels" . | nindent 4 }}
  name: {{ $name }}
  namespace: {{ $namespace }}
spec:
  entryPoints:
    - traefik
  routes:
    - kind: Rule
      match: PathPrefix(`/dashboard`) || PathPrefix(`/api`)
      middlewares:
        - name: {{ $name }}
      services:
        - kind: TraefikService
          name: api@internal
{{- end }}
