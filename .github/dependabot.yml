version: 2
updates:
  - directory: "/"
    groups:
      actions:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    package-ecosystem: "github-actions"
    schedule:
      interval: "weekly"

  - directory: "/"
    groups:
      hedera:
        patterns:
          - "com.hedera.*"
          - "org.hiero.*"
        exclude-patterns:
          - "com.hedera.hashgraph:sdk"
      java:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    package-ecosystem: "gradle"
    schedule:
      interval: "weekly"

  - directories:
      - "/charts/marketplace/gcp"
      - "/graphql"
      - "/grpc"
      - "/importer"
      - "/monitor"
      - "/pinger"
      - "/rest"
      - "/rest-java"
      - "/rest/monitoring"
      - "/rosetta"
      - "/rosetta/container"
      - "/test"
      - "/web3"
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10
    package-ecosystem: "docker"
    schedule:
      interval: "weekly"

  - directories:
      - "/charts/*"
    groups:
      chart:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    package-ecosystem: "helm"
    schedule:
      interval: "weekly"

  - directory: "/pinger"
    groups:
      pinger:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    package-ecosystem: "gomod"
    schedule:
      interval: "weekly"

  - directory: "/rest"
    groups:
      rest:
        patterns:
          - "*"
    ignore:
      - dependency-name: "prom-client"
        versions: [">=15.0.0"]
    open-pull-requests-limit: 10
    package-ecosystem: "npm"
    schedule:
      interval: "weekly"

  - directory: "/rest/monitoring"
    groups:
      monitoring:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    package-ecosystem: "npm"
    schedule:
      interval: "weekly"

  - directory: "/rosetta"
    groups:
      rosetta:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    package-ecosystem: "gomod"
    schedule:
      interval: "weekly"

  - directory: "/tools/bootstrap"
    groups:
      bootstrap:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    package-ecosystem: "gomod"
    schedule:
      interval: "weekly"

  - directory: "/tools/log-downloader"
    groups:
      log-downloader:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    package-ecosystem: "npm"
    schedule:
      interval: "weekly"

  - directory: "/tools/mirror-report"
    groups:
      mirror-report:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    package-ecosystem: "npm"
    schedule:
      interval: "weekly"
