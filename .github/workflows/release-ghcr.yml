# SPDX-License-Identifier: Apache-2.0

name: Release GHCR

on:
  push:
    tags:
      - "v*"

defaults:
  run:
    shell: bash

env:
  LC_ALL: C.UTF-8

permissions:
  contents: read

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        project:
          - grpc
          - importer
          - monitor
          - rest-java
          - web3
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Release native image
        uses: ./.github/actions/release-native-image
        with:
          architecture: ${{ matrix.architecture }}
          project: ${{ matrix.project }}

  manifest:
    needs: image
    strategy:
      fail-fast: false
      matrix:
        project:
          - grpc
          - importer
          - monitor
          - rest-java
          - web3
    env:
      IMAGE: ghcr.io/hiero-ledger/hiero-mirror-node/${{ matrix.project }}
    permissions:
      contents: read
      id-token: write
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install envsubst Dependency for Cosign
        run: sudo apt-get update && sudo apt-get install -y gettext-base

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Get version
        run: echo "VERSION=$(grep -oP 'version=\K.+' gradle.properties)" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          password: ${{ github.token }}
          registry: ghcr.io
          username: ${{ github.actor }}

      - name: Create Manifest
        run: |
          docker buildx imagetools create --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}:${VERSION}-amd64" "${IMAGE}:${VERSION}-arm64" \
            --metadata-file ./manifest.json
          echo "DIGEST=$(jq '."containerimage.descriptor".digest' -r ./manifest.json)" >> $GITHUB_ENV

      - name: Sign Image
        run: |
          COSIGN_EXPERIMENTAL=1 cosign sign --registry-referrers-mode=oci-1-1 --new-bundle-format=true --yes \
            "${IMAGE}@${DIGEST}"

      - name: Verify Image
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp="https://github.com/${GITHUB_REPOSITORY}" -o text
