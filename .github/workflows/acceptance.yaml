# SPDX-License-Identifier: Apache-2.0

name: End-to-end Tests

on:
  pull_request:
    branches:
      - "main"
      - "release/**"
    paths:
      - ".github/actions/k6/**"
      - ".github/workflows/acceptance.yaml"
      - ".github/workflows/run-e2e.yml"
      - "test/**"
  push:
    branches:
      - "main"
      - "release/**"
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch"
        required: true
        type: string

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  acceptance:
    name: acceptance (${{ matrix.stream-type }})
    strategy:
      fail-fast: false
      matrix:
        stream-type:
          - RECORD
          - BLOCK
    uses: ./.github/workflows/run-e2e.yml
    with:
      build-changed-modules-only: "true"
      image-source: jvm
      ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || '' }}
      run-k6: "true"
      stream-type: ${{ matrix.stream-type }}
      timeout-minutes: 50
    secrets: inherit
