# SPDX-License-Identifier: Apache-2.0

name: Gas Estimate Accuracy

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight UTC
  workflow_dispatch:
    inputs:
      network:
        description: "Mirror node network"
        required: true
        type: choice
        options:
          - mainnet
          - previewnet
          - testnet
        default: testnet
      total:
        description: "Number of contract results to process"
        required: false
        type: number
        default: 3000
      tolerance_percent_min:
        description: "Min estimate overhead above gas_used percent"
        required: false
        type: number
        default: 2
      tolerance_percent_max:
        description: "Max estimate overhead above gas_used percent"
        required: false
        type: number
        default: 20
      sleep_seconds:
        description: "Sleep between individual /contracts/call requests"
        required: false
        type: number
        default: 0.3

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  LC_ALL: C.UTF-8

jobs:
  verify:
    name: verify (${{ github.event_name == 'workflow_dispatch' && github.event.inputs.network || 'testnet' }})
    runs-on: hiero-mirror-node-linux-medium
    timeout-minutes: 180
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve configuration
        id: config
        env:
          NETWORK: ${{ github.event.inputs.network || 'testnet' }}
        run: |
          set -euo pipefail

          case "${NETWORK}" in
            mainnet) HOST="mainnet.mirrornode.hedera.com" ;;
            testnet) HOST="testnet.mirrornode.hedera.com" ;;
            previewnet) HOST="previewnet.mirrornode.hedera.com" ;;
            *)
              echo "Unsupported network: ${NETWORK}"
              exit 1
              ;;
          esac

          {
            echo "NETWORK=${NETWORK}"
            echo "BASE_URL=https://${HOST}"
          } >> "${GITHUB_ENV}"

          echo "Resolved network=${NETWORK} base_url=https://${HOST}"

      - name: Verify gas estimates
        env:
          RESULTS_COUNT: ${{ github.event.inputs.total || '3000' }}
          TOLERANCE_PERCENT: ${{ github.event.inputs.tolerance_percent_max || '20' }}
          MIN_TOLERANCE_PERCENT: ${{ github.event.inputs.tolerance_percent_min || '2' }}
          SLEEP_SECONDS: ${{ github.event.inputs.sleep_seconds || '0.3' }}
        run: |
          .github/workflows/resources/gas-estimate-accuracy.sh
