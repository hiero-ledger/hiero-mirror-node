# SPDX-License-Identifier: Apache-2.0

name: Test native images

on:
  # TEMP: remove pull_request trigger after validating the tag path in CI
  pull_request:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 5 * * *" # Daily at 5:00 AM UTC
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch"
        required: true
        type: string

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

env:
  LC_ALL: C.UTF-8
  # TEMP: remove FORCE_* vars after validating the tag path in CI
  FORCE_NATIVE_TAG_PATH: "true"
  FORCE_NATIVE_TAG_VERSION: "0.160.0-rc1"

jobs:
  image:
    # TEMP: also skip on pull_request (tag path pulls published images). Restore to:
    #   if: github.ref_type != 'tag'
    if: github.ref_type != 'tag' && github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        project:
          - grpc
          - importer
          - monitor
          - rest-java
          - web3
        architecture:
          - amd64
        include:
          - architecture: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || '' }}

      - name: Build native image
        uses: ./.github/actions/build-native-image
        with:
          architecture: ${{ matrix.architecture }}
          project: ${{ matrix.project }}

      - name: Save image
        env:
          IMAGE: ghcr.io/hiero-ledger/hiero-mirror-node/${{ matrix.project }}
        run: docker save "${IMAGE}:${VERSION}" | gzip > "${{ matrix.project }}.tar.gz"

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-image-${{ matrix.project }}
          path: ${{ matrix.project }}.tar.gz
          retention-days: 1
          compression-level: 0

  acceptance:
    name: acceptance (${{ matrix.stream-type }})
    needs: image
    if: always() && (needs.image.result == 'success' || needs.image.result == 'skipped')
    runs-on: hiero-mirror-node-linux-large
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        stream-type:
          - RECORD
          - BLOCK
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || '' }}

      - name: Download native images
        if: needs.image.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: native-image-*
          path: native-images
          merge-multiple: true

      - name: Load native images
        if: needs.image.result == 'success'
        run: |
          set -ex
          for archive in native-images/*.tar.gz; do
            gzip -dc "${archive}" | docker load
          done

      - name: Login to Docker Hub
        uses: step-security/docker-login-action@164e21d7e52229904128e2f946001cb88278c33d # v4.2.0
        if: vars.DOCKERHUB_USERNAME != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run end-to-end tests
        uses: ./.github/actions/run-e2e
        with:
          image-source: native
          stream-type: ${{ matrix.stream-type }}
