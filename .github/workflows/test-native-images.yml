# SPDX-License-Identifier: Apache-2.0

name: Test native images

on:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 5 * * *" # Daily at 5:00 AM UTC
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch"
        required: true
        type: string

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  acceptance-record:
    name: acceptance (RECORD)
    runs-on: hiero-mirror-node-linux-large
    timeout-minutes: 300
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || '' }}

      - name: Run end-to-end tests
        uses: ./.github/actions/run-e2e
        with:
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          image-source: native
          run-k6: "false"
          stream-type: RECORD

  acceptance-block:
    name: acceptance (BLOCK)
    runs-on: hiero-mirror-node-linux-large
    timeout-minutes: 300
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || '' }}

      - name: Run end-to-end tests
        uses: ./.github/actions/run-e2e
        with:
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
          image-source: native
          run-k6: "false"
          stream-type: BLOCK
