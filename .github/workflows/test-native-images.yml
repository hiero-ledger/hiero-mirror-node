# SPDX-License-Identifier: Apache-2.0

name: Test native images

on:
  pull_request:
    branches:
      - "main"
    paths:
      - ".github/workflows/build-native-images.yml"
      - ".github/workflows/run-e2e.yml"
      - ".github/workflows/test-native-images.yml"
      - "buildSrc/**"
      - "charts/**"
      - "grpc/**"
      - "importer/**"
      - "monitor/**"
      - "rest-java/**"
      - "web3/**"
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 6 * * *" # Daily at 6:00 AM UTC
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch"
        required: true
        type: string

permissions:
  contents: read
  packages: read
  pull-requests: read

jobs:
  build-native-images:
    name: Build native images
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-native-images.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || '' }}
    secrets: inherit

  native-acceptance:
    name: acceptance (${{ matrix.stream-type }})
    needs: build-native-images
    strategy:
      fail-fast: false
      matrix:
        stream-type:
          - RECORD
          - BLOCK
    uses: ./.github/workflows/run-e2e.yml
    with:
      image-source: native
      ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || '' }}
      run-k6: "false"
      stream-type: ${{ matrix.stream-type }}
      timeout-minutes: 60
    secrets: inherit
