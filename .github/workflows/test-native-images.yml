# SPDX-License-Identifier: Apache-2.0

name: Test native images

on:
  pull_request:
    branches:
      - "main"
      - "release/**"
    paths:
      - ".github/workflows/test-native-images.yml"
      - "buildSrc/src/main/kotlin/spring-conventions.gradle.kts"
  push:
    tags:
      - "v*"
  schedule:
    - cron: "0 5 * * *" # Daily at 5:00 AM UTC
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch"
        required: true
        type: string

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

env:
  LC_ALL: C.UTF-8

jobs:
  image:
    if: github.ref_type != 'tag'
    strategy:
      fail-fast: false
      matrix:
        project:
          - grpc
          - importer
          - monitor
          - rest-java
          - web3
        architecture:
          - amd64
        include:
          - architecture: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || '' }}

      - name: Build native image
        uses: ./.github/actions/build-native-image
        with:
          architecture: ${{ matrix.architecture }}
          project: ${{ matrix.project }}

      - name: Save image
        env:
          IMAGE: ghcr.io/hiero-ledger/hiero-mirror-node/${{ matrix.project }}
        run: docker save "${IMAGE}:${VERSION}" | gzip > "${{ matrix.project }}.tar.gz"

      - name: Upload image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-image-${{ matrix.project }}
          path: ${{ matrix.project }}.tar.gz
          retention-days: 1
          compression-level: 0

  acceptance:
    name: acceptance (${{ matrix.stream-type }})
    needs: image
    if: always() && (needs.image.result == 'success' || needs.image.result == 'skipped')
    runs-on: hiero-mirror-node-linux-large
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        stream-type:
          - RECORD
          # - BLOCK # leave it disabled until new wraps library compatible CN / BN release
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || '' }}

      - name: Download native images
        if: needs.image.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-image-*
          path: native-images
          merge-multiple: true

      - name: Load native images
        if: needs.image.result == 'success'
        run: |
          set -ex
          for archive in native-images/*.tar.gz; do
            gzip -dc "${archive}" | docker load
          done

      - name: Login to Docker Hub
        uses: step-security/docker-login-action@8c7b695d8738c5699a679ff5254baf0f19f20a94 # v4.6.0
        if: vars.DOCKERHUB_USERNAME != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run end-to-end tests
        uses: ./.github/actions/run-e2e
        with:
          image-source: native
          stream-type: ${{ matrix.stream-type }}
